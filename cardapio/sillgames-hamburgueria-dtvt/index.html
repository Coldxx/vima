<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SillGames Hamburgueria · Cardápio</title>
<meta name="description" content="Cardápio da hamburgueria artesanal SillGames Hamburgueria em Macaé. Escolha e peça pelo WhatsApp.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="SillGames Hamburgueria · Cardápio">
<meta property="og:description" content="Cardápio da hamburgueria artesanal SillGames Hamburgueria em Macaé. Escolha e peça pelo WhatsApp.">
<meta property="og:image" content="https://static.ifood-static.com.br/image/upload/t_high/capa/6d62b424-c50c-448d-ae0e-7dc9f4e3209d/202601161526_Goho_c.png">
<meta name="theme-color" content="#FFD21F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --card:#fff; --txt:#1c1916; --mut:#6b645b; --linha:#e7e0d5;
  --cor:#c2410c; --cor-escura:#7c2d12; --cor-txt:#fff; --cor-forte:#9a3412; --cor-suave:rgba(194,65,12,.1);
  --titulo:'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --corpo:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box}
html{background:#ebe5da;background:color-mix(in srgb,var(--cor) 10%,#ebe5da);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--corpo);color:var(--txt);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.pg{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh;min-height:100dvh;position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 30px 80px rgba(0,0,0,.08)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* faixa de demonstração */
.demo{background:#22250c;color:#eef0d6;font-size:12.5px;line-height:1.35;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.demo b{color:#fff;font-weight:700}
.demo button{background:none;border:0;padding:4px 0;color:#d6de7c;font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

/* topo */
.capa{height:196px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--cor),var(--cor-escura))}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.capa::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 45%,rgba(0,0,0,.28))}
.capa .padrao{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(circle at 1px 1px,#fff 1.2px,transparent 0);background-size:16px 16px}
.capa .marca-d{position:absolute;right:-8px;bottom:-26px;font-family:var(--titulo);font-weight:800;font-size:120px;line-height:1;color:rgba(255,255,255,.12);letter-spacing:-.04em;white-space:nowrap}
.topo{padding:0 18px;margin-top:-46px;position:relative;z-index:1}
.logo{width:92px;height:92px;border-radius:26px;border:4px solid var(--bg);background:var(--card);box-shadow:0 10px 24px rgba(0,0,0,.14);object-fit:cover;display:grid;place-items:center;overflow:hidden}
.logo.ini{background:var(--cor);color:var(--cor-txt);font-family:var(--titulo);font-weight:800;font-size:34px;letter-spacing:-.03em}
h1{font-family:var(--titulo);font-weight:800;font-size:clamp(27px,7.6vw,34px);line-height:1.02;letter-spacing:-.025em;margin:14px 0 6px}
.sub{color:var(--mut);font-size:14px;display:flex;flex-wrap:wrap;gap:2px 5px;align-items:center}
.linha-st{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px}
.linha-st .nota{color:var(--txt);font-weight:700;font-size:14px;display:inline-flex;gap:4px;align-items:center}
.linha-st .nota svg{color:#e3a008}
.linha-st .nota small{color:var(--mut);font-weight:500;font-size:13px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;padding:6px 11px 6px 9px;border-radius:999px;background:#e6f4ea;color:#14532d}
.status i{width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.2)}
.status.fechado{background:#f1ede6;color:#5b5349}
.status.fechado i{background:#9a9186;box-shadow:none}
.acoes{display:flex;gap:8px;margin-top:16px}
.bacao{flex:1;min-width:0;height:44px;border-radius:13px;border:1px solid var(--linha);background:var(--card);font-weight:600;font-size:14px;display:flex;gap:7px;align-items:center;justify-content:center;text-decoration:none;color:var(--txt)}
.bacao svg{flex:none}
.bacao.wpp{background:var(--cor);color:var(--cor-txt);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:12.5px;padding:6px 10px;border-radius:999px;background:var(--cor-suave);color:var(--cor-forte);font-weight:600;display:inline-flex;gap:5px;align-items:center}
.aviso{margin:14px 0 0;font-size:12.5px;color:var(--mut)}

/* busca e abas */
.nav{position:sticky;top:0;z-index:6;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:12px 0 0;margin-top:18px;border-bottom:1px solid var(--linha)}
.busca{margin:0 16px;display:flex;align-items:center;gap:8px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--linha);padding:0 14px;color:var(--mut)}
.busca:focus-within{border-color:var(--cor-forte);box-shadow:0 0 0 3px var(--cor-suave)}
.busca input{border:0;outline:0;flex:1;min-width:0;font:inherit;font-size:15px;background:transparent;color:var(--txt)}
.busca input::placeholder{color:#9b9388}
.abas{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 10px;scrollbar-width:none;scroll-behavior:smooth}
.abas::-webkit-scrollbar{display:none}
.aba{white-space:nowrap;padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px;border:0;background:transparent;color:var(--mut);transition:background .2s,color .2s}
.aba.ativa{background:var(--txt);color:var(--bg)}

/* mais pedidos */
.sec{padding:24px 16px 6px;scroll-margin-top:118px}
.sec h2{font-family:var(--titulo);font-size:23px;font-weight:800;letter-spacing:-.015em;line-height:1.1;margin:0}
.sec .sdesc{color:var(--mut);font-size:13.5px;margin:4px 0 0}
.dest{display:flex;gap:12px;overflow-x:auto;padding:14px 16px 6px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.dest::-webkit-scrollbar{display:none}
.dcard{flex:0 0 164px;scroll-snap-align:start;scroll-margin-left:16px;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--linha);text-align:left;padding:0;display:flex;flex-direction:column}
.dcard .foto{aspect-ratio:4/3;background:linear-gradient(135deg,var(--cor),var(--cor-escura));position:relative;overflow:hidden}
.dcard .foto img{width:100%;height:100%;object-fit:cover;display:block}
.dcard .foto span{position:absolute;left:12px;bottom:6px;font-family:var(--titulo);font-weight:800;font-size:44px;line-height:1;color:rgba(255,255,255,.28)}
.dcard .t{padding:10px 12px 0;font-weight:700;font-size:14.5px;line-height:1.2}
.dcard .p{padding:6px 12px 12px;margin-top:auto;color:var(--cor-forte);font-weight:700;font-size:14px}

/* itens */
.item{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--linha);padding:15px 0;align-items:flex-start}
.item:last-child{border-bottom:0}
.item .txt{flex:1;min-width:0}
.item .nome{font-weight:700;font-size:16px;line-height:1.25}
.item .d{color:var(--mut);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.item .preco{margin-top:8px;font-weight:700;font-size:15px}
.item .preco small{color:var(--mut);font-weight:500;font-size:13px}
.selos{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.selo{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--cor-forte);background:var(--cor-suave);padding:3px 7px;border-radius:6px}
.selo.picante{color:#b91c1c;background:rgba(220,38,38,.1)}
.selo.veg{color:#15803d;background:rgba(22,163,74,.12)}
.selo.novo{color:#1d4ed8;background:rgba(37,99,235,.1)}
html.escuro .selo.picante{color:#fca5a5}
html.escuro .selo.veg{color:#86efac}
html.escuro .selo.novo{color:#93c5fd}
.item .img{width:96px;height:96px;border-radius:16px;object-fit:cover;flex:none;background:var(--linha);display:block}
.item .mais{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--cor-suave);color:var(--cor-forte);margin-top:2px}
.item.no-carrinho .mais{background:var(--cor);color:var(--cor-txt);font-weight:700;font-size:14px}
.vazio{padding:40px 24px;text-align:center;color:var(--mut)}

.rodape{padding:34px 20px calc(130px + env(safe-area-inset-bottom));text-align:center;color:var(--mut);font-size:13px;line-height:1.6}
.rodape .end{color:var(--txt);font-weight:600}
.rodape .vima{display:inline-flex;align-items:center;gap:6px;margin-top:18px;padding:8px 14px;border-radius:999px;border:1px solid var(--linha);background:var(--card);text-decoration:none;font-size:12.5px;color:var(--mut)}
.rodape .vima b{color:#4a5113;letter-spacing:.06em}

/* barra do pedido */
.barra{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,160%);width:min(532px,calc(100% - 24px));height:60px;border-radius:18px;background:var(--cor);color:var(--cor-txt);display:flex;align-items:center;gap:12px;padding:0 18px 0 12px;font-weight:700;font-size:15.5px;box-shadow:0 14px 34px rgba(0,0,0,.28);border:0;z-index:8;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.barra.on{transform:translate(-50%,0)}
.barra .qt{min-width:34px;height:34px;padding:0 8px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:15px}
.barra.clara .qt{background:rgba(0,0,0,.12)}
.barra .rot{flex:1;text-align:left}
.barra .tot{font-variant-numeric:tabular-nums}

/* folhas (item, pedido, sobre) */
.fundo{position:fixed;inset:0;background:rgba(20,16,12,.52);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.fundo.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:21;box-shadow:0 -10px 40px rgba(0,0,0,.2);visibility:hidden}
.folha.on{transform:translate(-50%,0);visibility:visible}
.folha .rola{overflow-y:auto;overscroll-behavior:contain;flex:1}
.folha .alca{width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.18);margin:8px auto 0;position:absolute;left:50%;transform:translateX(-50%);top:0;z-index:2}
.fechar{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(0,0,0,.15);display:grid;place-items:center;z-index:3}
.fimg{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--linha)}
.fc{padding:22px 20px 18px}
.fc h3{font-family:var(--titulo);font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 34px 6px 0}
.fc .fd{color:var(--mut);margin:0}
.fc .fp{font-weight:700;font-size:17px;margin-top:10px}
.grupo{margin-top:22px}
.grupo>.gt{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:10px}
.grupo>.gt small{font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:var(--chip,#ece6dc);padding:3px 7px;border-radius:6px}
.op{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--linha);border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer}
.op:has(input:checked){border-color:var(--cor-forte);box-shadow:0 0 0 2px var(--cor-suave)}
.op input{accent-color:var(--cor-forte);width:19px;height:19px;margin:0}
.op span{flex:1}
.op b{font-weight:600;font-variant-numeric:tabular-nums}
textarea,.campo input,.campo select{width:100%;font:inherit;font-size:15px;color:var(--txt);border:1px solid var(--linha);background:var(--card);border-radius:13px;padding:12px 14px;outline:0}
textarea{min-height:76px;resize:vertical}
textarea:focus,.campo input:focus,.campo select:focus{border-color:var(--cor-forte);box-shadow:0 0 0 3px var(--cor-suave)}
.campo{margin-top:12px;display:block}
.campo>span{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:6px}
.campo.erro input{border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.fpe{position:sticky;bottom:0;background:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;border-top:1px solid var(--linha)}
.qtd{display:flex;align-items:center;border:1px solid var(--linha);border-radius:14px;background:var(--card);height:52px}
.qtd button{width:42px;height:100%;border:0;background:none;display:grid;place-items:center;color:var(--cor-forte)}
.qtd button:disabled{color:#c9c1b5}
.qtd output{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.grande{flex:1;height:52px;border-radius:15px;background:var(--cor);color:var(--cor-txt);font-weight:700;font-size:15.5px;border:0;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 14px}
.grande.sec2{background:var(--card);color:var(--txt);border:1px solid var(--linha)}

/* pedido */
.ped h3{margin-right:40px}
.linha{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--linha);align-items:center}
.linha .lt{flex:1;min-width:0}
.linha .ln{font-weight:600}
.linha .lo{font-size:13px;color:var(--mut)}
.linha .lv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.linha .qtd{height:38px;border-radius:11px}
.linha .qtd button{width:32px}
.seg{display:flex;background:var(--chip,#ece6dc);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:10px;border:0;background:none;font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.totais{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--linha)}
.totais div{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);padding:3px 0}
.totais div.t{color:var(--txt);font-weight:800;font-size:17px;padding-top:8px;margin-top:6px;border-top:1px dashed var(--linha)}

/* prévia do whatsapp */
.zap{margin-top:16px;border-radius:18px;padding:16px 12px;background:#e9e2d8;background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:12px 12px}
.zap .topo-zap{display:flex;align-items:center;gap:10px;margin:-4px 0 12px 2px;font-size:13px;color:#4b463f}
.zap .topo-zap i{width:30px;height:30px;border-radius:50%;background:var(--cor);display:grid;place-items:center;color:var(--cor-txt);font-style:normal;font-weight:800;font-size:13px}
.bolha{background:#d9fdd3;border-radius:12px 12px 3px 12px;padding:10px 12px 8px;white-space:pre-wrap;font-size:14px;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.1);margin-left:auto;max-width:94%;word-wrap:break-word;color:#111b21}
.bolha .h{display:block;text-align:right;font-size:11px;color:#667781;margin-top:2px}
.explica{font-size:14px;color:var(--mut);margin:14px 0 0}
.passos{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.passos li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;font-size:14.5px}
.passos li b{flex:none;width:26px;height:26px;border-radius:8px;background:var(--cor-suave);color:var(--cor-forte);display:grid;place-items:center;font-size:13px}

/* fundo escuro (escolha do dono) */
html.escuro{--bg:#141311;--card:#1d1b19;--txt:#f3eee6;--mut:#a39b90;--linha:#2d2a26;--chip:#2a2723;background:#0b0a09}
html.escuro .status{background:rgba(34,197,94,.14);color:#86efac}
html.escuro .status.fechado{background:#2a2723;color:#bdb5aa}
html.escuro .fechar{background:rgba(29,27,25,.94);color:#f3eee6}
html.escuro .rodape .vima b{color:#cdd47a}
html.escuro .busca input::placeholder{color:#7d766c}
html.escuro .qtd button:disabled{color:#5a544d}
html.escuro .pg{box-shadow:none}
html.escuro .folha{box-shadow:0 -10px 40px rgba(0,0,0,.6)}

/* vitrine: fotos grandes em duas colunas */
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0 6px}
.gcard{position:relative;background:var(--card);border:1px solid var(--linha);border-radius:18px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;color:inherit;transition:transform .2s}
.gcard:active{transform:scale(.98)}
.gcard .gimg{aspect-ratio:1/1;width:100%;object-fit:cover;display:block;background:var(--linha)}
.gcard .t{padding:10px 12px 0;font-weight:700;font-size:14.5px;line-height:1.2}
.gcard .gd{padding:3px 12px 0;color:var(--mut);font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .p{padding:8px 12px 12px;margin-top:auto;font-weight:700;font-size:14px;color:var(--cor-forte)}
.gcard .qtd-b{position:absolute;top:8px;right:8px;min-width:28px;height:28px;border-radius:14px;background:var(--cor);color:var(--cor-txt);display:grid;place-items:center;font-weight:800;font-size:13px;padding:0 7px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.gcard .selo-g{position:absolute;top:8px;left:8px}
.gcard .selo-g .selo{background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.18)}
html.escuro .gcard .selo-g .selo{background:rgba(20,19,17,.88)}

/* faixa de aviso da loja */
.aviso-loja{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--cor-suave);color:var(--txt);font-size:14px;font-weight:600;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.aviso-loja svg{color:var(--cor-forte);flex:none;margin-top:1px}

/* cardápio em vídeo: fileira de "stories" */
.vv{margin:20px -18px 0}
.vv-topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 18px 10px}
.vv-topo b{font-family:var(--titulo);font-size:19px;font-weight:800;letter-spacing:-.01em}
.vv-topo span{font-size:12.5px;color:var(--mut)}
.vv-lista{display:flex;gap:10px;overflow-x:auto;padding:4px 18px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.vv-lista::-webkit-scrollbar{display:none}
.vv-card{flex:0 0 104px;aspect-ratio:9/16;border-radius:16px;overflow:hidden;position:relative;border:0;padding:0;background:#111;scroll-snap-align:start;scroll-margin-left:18px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--cor),0 8px 20px rgba(0,0,0,.18);margin:4px 2px}
.vv-card>img,.vv-card>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vv-card::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 40%,rgba(0,0,0,.78));pointer-events:none}
.vv-card .vv-nome{position:absolute;left:8px;right:8px;bottom:8px;z-index:1;color:#fff;font-size:12.5px;font-weight:700;line-height:1.2;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.cheia{position:fixed;inset:0;z-index:15;background:#000;display:none}

.slide{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;color:#fff;max-width:560px;margin:0 auto;background:#111}
.slide>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.5) 0,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 42%,rgba(0,0,0,.88) 100%);pointer-events:none}

    var crc = 0xFFFF;
    for (var i = 0; i < s.length; i++) {
      crc ^= s.charCodeAt(i) << 8;
      for (var j = 0; j < 8; j++) { crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1); crc &= 0xFFFF; }
    }
    return crc.toString(16).toUpperCase().padStart(4, '0');
  }
  function pixCopiaECola(valor) {
    var p = D.pix || {}, chave = String(p.chave || '').trim();
    if (!chave) return null;
    var limpa = function (s, n, padrao) { return (norm(s).replace(/[^a-z0-9 ]/g, '').toUpperCase().trim().slice(0, n)) || padrao; };
    var corpo = emv('00', '01') + emv('26', emv('00', 'br.gov.bcb.pix') + emv('01', chave)) + emv('52', '0000') + emv('53', '986') +
      (valor > 0 ? emv('54', valor.toFixed(2)) : '') + emv('58', 'BR') + emv('59', limpa(p.nome || D.nome, 25, 'LOJA')) +
      emv('60', limpa(p.cidade || String(D.cidade || '').replace(/\s*-\s*[A-Za-z]{2}$/, ''), 15, 'MACAE')) + emv('62', emv('05', '***')) + '6304';
    return corpo + crc16(corpo);

  function copiar(texto, botao) {
    var ok = function () { var t = botao.textContent; botao.textContent = 'Copiado ✓'; setTimeout(function () { botao.textContent = t; }, 1800); };
    try {
      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(texto).then(ok, function () { antigo(); }); return; }
    } catch (e) { }
    antigo();
    function antigo() {
      var ta = h('textarea', { readonly: true, style: 'position:fixed;left:-9999px' }); ta.value = texto; document.body.append(ta);
      ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { } ta.remove();
    }
  }

  function abrirPedido() {

          h('option', { value: '__outro', text: 'Outro bairro (combinar a taxa)' }));
        selBairro.value = form.bairro;
        selBairro.addEventListener('change', function () { form.bairro = selBairro.value; lembrarCliente(); desenhar(); });
      }
      corpo.append(h('div', { class: 'grupo' }, h('div', { class: 'gt' }, 'Seus dados', h('small', { class: 'sem-conta', text: 'sem cadastro' })),
        h('p', { class: 'nota-p', text: 'Ficam salvos só neste celular, para o próximo pedido.' }),
        campo('Seu nome', 'nome', { autocomplete: 'name', placeholder: 'Como podemos te chamar?' }),
        selBairro ? h('label', { class: 'campo', 'data-campo': 'bairro' }, h('span', { text: 'Bairro' }), selBairro) : null,
        form.tipo === 'entrega' ? campo('Endereço de entrega', 'end', { autocomplete: 'street-address', placeholder: BAIRROS.length ? 'Rua, número e referência' : 'Rua, número, bairro e referência' }) : null,
        (function () {
          var sel = h('select', { 'aria-label': 'Forma de pagamento' }, pags.map(function (p) { var o = h('option', { value: p, text: p }); o.selected = p === form.pag; return o; }));
          sel.addEventListener('change', function () { form.pag = sel.value; desenhar(); });
          return h('label', { class: 'campo' }, h('span', { text: 'Pagamento' }), sel);
        })(),
        /dinheiro/i.test(form.pag) ? campo('Troco para quanto? (opcional)', 'troco', { inputmode: 'decimal', placeholder: 'Ex.: 100' }) : null));
      /* cupom */
      if (CUPONS.length) {
        var inpC = h('input', { value: form.cupom, placeholder: 'Tem cupom? Digite aqui', autocomplete: 'off', 'aria-label': 'Cupom de desconto' });
        var aplicar = h('button', { type: 'button', class: 'b-cupom', text: 'Aplicar', onclick: function () { form.cupom = inpC.value.trim(); desenhar(); } });
        inpC.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); aplicar.click(); } });
        var cvx = cupomValido();
        corpo.append(h('div', { class: 'grupo' }, h('div', { class: 'gt' }, 'Cupom de desconto'),
          h('div', { class: 'cupom' }, inpC, aplicar),
          form.cupom ? h('p', { class: 'cupom-msg' + (cvx.cupom ? ' ok' : ''), text: cvx.cupom ? 'Cupom ' + cvx.cupom.codigo.toUpperCase() + ' aplicado' + (cvx.cupom.descricao ? ': ' + cvx.cupom.descricao : '') + '.' : cvx.aviso }) : null));

        h('div', { class: 't' }, h('span', { text: 'Total' }), h('span', { text: preco(c.total) + (form.tipo === 'entrega' && c.taxa === null ? ' + entrega' : '') }))));
      if (c.falta) corpo.append(h('p', { class: 'minimo', role: 'status', text: 'Pedido mínimo de ' + preco(c.minimo) + '. Faltam ' + preco(c.falta) + '.' }));

        if (c.taxa === null) corpo.append(h('div', { class: 'pix' }, h('b', { text: 'Pix' }), h('p', { text: 'Quando a loja confirmar a taxa de entrega, ela manda o Pix com o valor certo.' })));

            h('b', { text: 'Pague com Pix copia e cola' }),
            h('p', { text: MODO === 'demo' ? 'Na loja de verdade, este código já vai com a chave Pix da loja e o valor do pedido. Aqui é só exemplo.' : 'O código já tem o valor do pedido. Copie, cole no app do banco e mande o comprovante junto com o pedido.' }),
            bcp));
        }
      }
    };
    desenhar();
    var enviar = h('button', { type: 'button', class: 'grande' }, ic('wpp'), MODO === 'demo' ? 'Ver como o pedido chega' : 'Enviar pedido no WhatsApp');
    enviar.addEventListener('click', function () {
      if (MODO === 'real') {
        var faltam = [];
        if (contas().falta) { var m = corpo.querySelector('.minimo'); if (m) m.scrollIntoView({ block: 'center' }); return; }

  }

  function mensagem() {
    var L = ['*Novo pedido · ' + D.nome + '*', ''];
    carrinho.forEach(function (l) {
      L.push(l.qtd + 'x ' + l.nome + (l.opcao ? ' · ' + l.opcao : '') + (l.preco != null ? ' — ' + preco(l.preco * l.qtd) : ''));
      if (l.obs) L.push('   _obs.: ' + l.obs + '_');
    });
    var c = contas();
    L.push('', 'Itens: ' + preco(c.itens));
    if (c.desconto) L.push('Cupom ' + c.cupom.codigo.toUpperCase() + ': − ' + preco(c.desconto));
    if (form.tipo === 'entrega') L.push('Entrega' + (form.bairro && form.bairro !== '__outro' ? ' (' + form.bairro + ')' : '') + ': ' + (c.taxa === null ? 'a combinar' : (c.taxa ? preco(c.taxa) : 'grátis')));
    L.push('*Total: ' + preco(c.total) + (form.tipo === 'entrega' && c.taxa === null ? ' + entrega' : '') + '*');
    if (form.tipo === 'entrega') {
      L.push('', '*Entrega*', (form.end.trim() || '(endereço)') + (form.bairro && form.bairro !== '__outro' ? ' · ' + form.bairro : ''));
    } else L.push('', '*Retirada no local*');
    L.push('Pagamento: ' + form.pag + (/dinheiro/i.test(form.pag) && form.troco.trim() ? ' (troco para R$ ' + form.troco.trim() + ')' : '') + (/pix/i.test(form.pag) && D.pix && D.pix.chave && c.taxa !== null ? ' (copia e cola de ' + preco(c.total) + ')' : ''));
    L.push('Nome: ' + (form.nome.trim() || '(nome do cliente)'));
    L.push('', 'Pedido feito pelo cardápio digital');
    return L.join('\n');
  }
  function bolha(texto) {
    /* o WhatsApp deixa *assim* em negrito e _assim_ em itálico */
    var b = h('div', { class: 'bolha' });
    texto.split(/(\*[^*\n]+\*|_[^_\n]+_)/).forEach(function (pedaco) {
      if (/^\*[^*]+\*$/.test(pedaco)) b.append(h('b', { text: pedaco.slice(1, -1) }));
      else if (/^_[^_]+_$/.test(pedaco)) b.append(h('i', { text: pedaco.slice(1, -1) }));
      else b.append(document.createTextNode(pedaco));
    });
    var a = agora(); b.append(h('span', { class: 'h', text: Math.floor(a.min / 60) + ':' + String(a.min % 60).padStart(2, '0') + ' ✓✓' }));
    return b;
  }
  function abrirPrevia() {
    var msg = mensagem();
    var nome = D.nome;
    abrirFolha([
      h('div', { class: 'rola' }, h('div', { class: 'fc' },

        h('p', { class: 'explica', text: 'Nesta demonstração o pedido não vai para ninguém. Se quiser ver no seu celular, mande para você mesmo.' }))),

    ], 'Prévia do pedido no WhatsApp');
  }
  function abrirSobre() {

      h('div', { class: 'rola' }, h('div', { class: 'fc' },

        h('ul', { class: 'passos' },
          h('li', null, h('b', { text: '1' }), h('span', { text: 'O cliente abre o link e vê tudo com foto e preço.' })),
          h('li', null, h('b', { text: '2' }), h('span', { text: 'Escolhe, monta o pedido e escreve o endereço.' })),

    ], 'Sobre esta demonstração');
